[project]
name = "nur-physio"
version = "0.1.0"
description = "Buchhaltungs- und Rechnungswerkzeug für Physiotherapiepraxen"
authors = [{ name = "Nur.physio" }]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.24.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.5",
]

[project.scripts]
nur-physio = "nur_physio.cli:run"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"nur_physio" = [
    "web/templates/*.html",
    "web/static/*",
]
