[project]
name = "nur-physio"
version = "0.1.0"
description = "Buchhaltungs- und Rechnungswerkzeug für Physiotherapiepraxen"
authors = [{ name = "Nur.physio" }]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
nur-physio = "nur_physio.cli:run"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
