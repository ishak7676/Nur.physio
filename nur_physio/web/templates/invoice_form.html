{% extends "base.html" %}
{% block title %}Neue Rechnung – Nur.physio{% endblock %}
{% block content %}
<a class="back-link" href="/invoices">&larr; Zurück</a>
<h2>Neue Rechnung</h2>
<form method="post" class="form" id="invoice-form">
    <div class="form-grid">
        <label>Filiale
            <select name="branch_id" required>
                {% for branch in branches %}
                <option value="{{ branch.id }}">{{ branch.name }} ({{ branch.city or '-' }})</option>
                {% endfor %}
            </select>
        </label>
        <label>Kunde
            <select name="customer_id" required>
                {% for customer in customers %}
                <option value="{{ customer.id }}">{{ customer.last_name }}, {{ customer.first_name }}</option>
                {% endfor %}
            </select>
        </label>
        <label>Rechnungsdatum
            <input type="date" name="issue_date">
        </label>
        <label>Fällig am
            <input type="date" name="due_date">
        </label>
        <label>Hinweise
            <textarea name="notes" rows="3"></textarea>
        </label>
    </div>
    <h3>Leistungen</h3>
    <div id="invoice-items">
        <div class="item-row">
            <label>Leistung
                <select name="service_id" required>
                    <option value="">-- bitte wählen --</option>
                    {% for service in services %}
                    <option value="{{ service.id }}" data-price="{{ '%.2f'|format(service.unit_price) }}">{{ service.name }} ({{ '%.2f'|format(service.unit_price) }} €)</option>
                    {% endfor %}
                </select>
            </label>
            <label>Menge
                <input type="number" name="quantity" value="1" min="0" step="0.25" required>
            </label>
            <label>Preis €
                <input type="number" name="unit_price" step="0.01" min="0">
            </label>
            <button type="button" class="remove">Entfernen</button>
        </div>
    </div>
    <button type="button" id="add-item">Weitere Leistung hinzufügen</button>
    <div class="form-actions">
        <button type="submit">Rechnung erstellen</button>
    </div>
</form>
{% endblock %}
{% block scripts %}
<script>
(function() {
    const container = document.getElementById('invoice-items');
    const addButton = document.getElementById('add-item');
    const issueDate = document.querySelector('input[name="issue_date"]');
    if (issueDate && !issueDate.value) {
        issueDate.valueAsDate = new Date();
    }

    function bindRow(row) {
        const serviceSelect = row.querySelector('select[name="service_id"]');
        const priceInput = row.querySelector('input[name="unit_price"]');
        if (serviceSelect) {
            serviceSelect.addEventListener('change', () => {
                const option = serviceSelect.selectedOptions[0];
                if (option && option.dataset.price && !priceInput.value) {
                    priceInput.value = option.dataset.price;
                }
            });
        }
        row.querySelector('.remove').addEventListener('click', () => {
            if (container.children.length > 1) {
                row.remove();
            }
        });
    }

    addButton.addEventListener('click', () => {
        const template = container.children[0].cloneNode(true);
        template.querySelectorAll('input').forEach((input) => {
            if (input.type === 'number') {
                input.value = input.name === 'quantity' ? '1' : '';
            } else {
                input.value = '';
            }
        });
        template.querySelector('select[name="service_id"]').selectedIndex = 0;
        container.appendChild(template);
        bindRow(template);
    });

    Array.from(container.children).forEach(bindRow);
})();
</script>
{% endblock %}
